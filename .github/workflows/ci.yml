name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: tripsync-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.lock
      - run: |
          cp .env.example .env
          sed -i '/^DATABASE_URL=/d' .env
          echo 'DATABASE_URL=postgresql+asyncpg://postgres:tripsync-ci@localhost:5432/postgres' >> .env
          PYTHONPATH=backend python -m app.cli init-local-key
          python backend/tests/clean_setup.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
